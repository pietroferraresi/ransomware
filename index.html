<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modernized Site</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        h1, h2, h3 {
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #0056b3;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #0056b3;
            color: white;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Modern Site</h1>
        <h2>Explore the Features</h2>
        <div class="card">
            <h3>Feature 1</h3>
            <p>This is a description of feature 1.</p>
        </div>
        <div class="card">
            <h3>Feature 2</h3>
            <p>This is a description of feature 2.</p>
        </div>
        <div class="card">
            <h3>Feature 3</h3>
            <p>This is a description of feature 3.</p>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Modernized Site. All rights reserved.</p>
    </footer>
</body>
</html>
